<script>
  (function() {
    function applyTheme(mode) {
      const html = document.documentElement;
      const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (mode === 'dark' || (mode === 'system' && isSystemDark)) {
        html.classList.add('dark');
      } else {
        html.classList.remove('dark');
      }
    }

    // 升级深色科技主题：首次访问时默认 dark（仅迁移一次，之后以用户手动选择为准）
    if (!localStorage.getItem('themeMigratedV2')) {
      localStorage.setItem('themeMode', 'dark');
      localStorage.setItem('themeMigratedV2', '1');
    }
    const savedTheme = localStorage.getItem('themeMode') || 'dark';
    applyTheme(savedTheme);

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      const currentMode = localStorage.getItem('themeMode') || 'system';
      if (currentMode === 'system') {
        applyTheme('system');
      }
    });

    window.addEventListener('load', async () => {
      if (window.location.pathname.startsWith('/admin')) {
        try {
          const res = await fetch('/api/config');
          const config = await res.json();
          const select = document.getElementById('themeModeSelect');
          // 仅同步明确的 light/dark；服务端出厂默认 system 不覆盖本地选择（含首次迁移到 dark）
          if ((config.THEME_MODE === 'light' || config.THEME_MODE === 'dark')
              && config.THEME_MODE !== localStorage.getItem('themeMode')) {
            localStorage.setItem('themeMode', config.THEME_MODE);
            applyTheme(config.THEME_MODE);
            if (select) select.value = config.THEME_MODE;
          } else if (select) {
            select.value = localStorage.getItem('themeMode') || 'dark';
          }
        } catch(e) {}
      }
    });
    
    window.updateAppTheme = function(mode) {
      localStorage.setItem('themeMode', mode);
      applyTheme(mode);
    };
  })();
</script>
